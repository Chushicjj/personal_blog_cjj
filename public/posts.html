<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>文章 · Blog_j</title>
  <meta name="description" content="Blog_j 的全部技术文章。">
  <meta name="theme-color" content="#fdfbf7">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/css/base.css">
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('blog-theme');
        var theme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <a class="skip-link" href="#main">跳到正文</a>

  <header class="site-header">
    <div class="header-inner">
      <a class="logo" href="/"><span class="logo-a" data-author>cjj</span><span class="logo-b" data-site-name>Blog_j</span></a>

      <nav class="top-nav" aria-label="主导航">
        <a href="/" data-nav="home">首页</a>
        <a href="/posts.html" data-nav="posts" aria-current="page">文章</a>
        <a href="/guestbook.html" data-nav="guestbook">留言</a>
        <a href="/about.html" data-nav="about">关于</a>
      </nav>

      <div class="header-actions">
        <button class="theme-btn" type="button" id="theme-toggle" aria-pressed="false"><span id="theme-label">深色</span></button>
        <button class="menu-btn" type="button" id="menu-toggle" aria-expanded="false" aria-controls="mobile-menu">菜单</button>
      </div>
    </div>
  </header>

  <div class="mobile-menu" id="mobile-menu">
    <a href="/">首页</a>
    <a href="/posts.html">文章</a>
    <a href="/guestbook.html">留言</a>
    <a href="/about.html">关于</a>
  </div>

  <main class="page" id="main">
    <div class="page-head">
      <h1>文章</h1>
      <p id="posts-count">正在加载…</p>
    </div>

    <div class="posts-toolbar">
      <input class="input" id="posts-search" type="search" placeholder="搜索标题或正文…" aria-label="搜索文章">
    </div>

    <div class="filter-row" id="category-row" hidden>
      <span class="filter-label">分类</span>
      <div class="chips" id="posts-categories" role="group" aria-label="按分类筛选"></div>
    </div>

    <div class="post-list" id="post-list">
      <div class="state">正在加载文章…</div>
    </div>

    <div id="posts-empty" class="state" hidden><strong>该标签下还没有文章</strong></div>

    <div class="list-actions" id="posts-more" hidden>
      <button class="btn" id="posts-load-more" type="button">加载更多</button>
    </div>
  </main>

  <footer class="site-footer">
    <span>© <span data-year>2026</span> <span data-site-name>Blog_j</span></span>
    <span class="sep">·</span>
    <span>建站于 <span data-since>2024.03</span></span>
    <span class="sep">·</span>
    <span>Node.js · Nginx</span>
    <span class="sep">·</span>
    <a class="footer-link" href="/archive.html">归档</a>
    <a class="footer-link" href="/account.html">账号</a>
    <button class="to-top" id="to-top" type="button" aria-label="回到顶部">↑</button>
  </footer>

  <script src="/assets/js/config.js"></script>
  <script src="/assets/js/settings.js"></script>
  <script src="/assets/js/util.js"></script>
  <script src="/assets/js/posts.js"></script>
  <script src="/assets/js/shell.js"></script>
</body>
</html>
