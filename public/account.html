<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>账号 · Blog_j</title>
  <meta name="description" content="登录或注册账号，参与文章评论。">
  <meta name="robots" content="noindex, follow">
  <meta name="theme-color" content="#fdfbf7">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/css/base.css">
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('blog-theme');
        var theme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <a class="skip-link" href="#main">跳到正文</a>

  <header class="site-header">
    <div class="header-inner">
      <a class="logo" href="/"><span class="logo-a" data-author>cjj</span><span class="logo-b" data-site-name>Blog_j</span></a>

      <nav class="top-nav" aria-label="主导航">
        <a href="/" data-nav="home">首页</a>
        <a href="/posts.html" data-nav="posts">文章</a>
        <a href="/guestbook.html" data-nav="guestbook">留言</a>
        <a href="/about.html" data-nav="about">关于</a>
        <a href="/account.html" data-nav="account" aria-current="page">账号</a>
      </nav>

      <div class="header-actions">
        <button class="theme-btn" type="button" id="theme-toggle" aria-pressed="false"><span id="theme-label">深色</span></button>
        <button class="menu-btn" type="button" id="menu-toggle" aria-expanded="false" aria-controls="mobile-menu">菜单</button>
      </div>
    </div>
  </header>

  <div class="mobile-menu" id="mobile-menu">
    <a href="/">首页</a>
    <a href="/posts.html">文章</a>
    <a href="/guestbook.html">留言</a>
    <a href="/about.html">关于</a>
    <a href="/account.html">账号</a>
  </div>

  <main class="page" id="main">
    <div class="auth-card">
      <h1 id="auth-title">登录</h1>
      <p class="sub" id="auth-sub">登录后即可在文章下留言评论。</p>

      <div class="tabs" id="auth-tabs" role="tablist" aria-label="登录或注册">
        <button type="button" class="is-active" data-mode="login" role="tab" aria-selected="true">登录</button>
        <button type="button" data-mode="register" role="tab" aria-selected="false">注册</button>
      </div>

      <form class="auth-form" id="auth-form" novalidate>
        <div class="auth-field">
          <label class="field-label" for="username">用户名</label>
          <input class="input" id="username" name="username" maxlength="20" autocomplete="username" placeholder="3–20 位字母、数字、下划线" required>
        </div>

        <div class="auth-field" id="nickname-field" hidden>
          <label class="field-label" for="nickname">昵称（可选）</label>
          <input class="input" id="nickname" name="nickname" maxlength="20" placeholder="评论里显示的名字，留空就用用户名">
        </div>

        <div class="auth-field">
          <label class="field-label" for="password">密码</label>
          <input class="input" id="password" name="password" type="password" maxlength="200" autocomplete="current-password" placeholder="至少 8 位" required>
        </div>

        <button class="btn btn-primary" id="auth-submit" type="submit">登录</button>
      </form>

      <p class="auth-note" id="auth-note" aria-live="polite"></p>

      <div class="auth-me" id="auth-me" hidden>
        <p>已登录：<strong id="me-name"></strong></p>
        <button class="btn" id="auth-logout" type="button">退出登录</button>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <span>© <span data-year>2026</span> <span data-site-name>Blog_j</span></span>
    <span class="sep">·</span>
    <span>建站于 <span data-since>2024.03</span></span>
    <span class="sep">·</span>
    <span>Node.js · Nginx</span>
    <span class="sep">·</span>
    <a class="footer-link" href="/account.html">账号</a>
    <button class="to-top" id="to-top" type="button" aria-label="回到顶部">↑</button>
  </footer>

  <script src="/assets/js/config.js"></script>
  <script src="/assets/js/settings.js"></script>
  <script src="/assets/js/util.js"></script>
  <script src="/assets/js/account.js"></script>
  <script src="/assets/js/shell.js"></script>
</body>
</html>
