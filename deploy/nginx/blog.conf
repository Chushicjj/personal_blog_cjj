# =============================================================
# /etc/nginx/conf.d/blog.conf  —— 静态托管 + 接口反代示例
#
# 部署约定：
#   静态文件：把项目 public/ 目录内容同步到 /var/www/blog
#   后端容器：docker-compose 里只绑 127.0.0.1:3000，公网只能走这里
# =============================================================

server {
    listen 80;
    server_name blog.example.com;

    root /var/www/blog;
    index index.html;

    charset utf-8;
    client_max_body_size 1m;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # ---------- 静态资源：内容不变，长缓存 ----------
    location ~* \.(css|js|svg|png|jpg|jpeg|webp|ico|woff2?)$ {
        expires 365d;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # ---------- HTML 不缓存，发版后立即生效 ----------
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # ---------- 健康检查（不写访问日志，避免刷屏） ----------
    location = /health {
        proxy_pass http://127.0.0.1:3000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    # ---------- 动态生成的 sitemap 与 RSS ----------
    # 这两个是后端实时拼的 XML，磁盘上没有对应文件，
    # 不单独回源的话会落到 location / 的 try_files 变成 404
    location = /sitemap.xml {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    location = /feed.xml {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    # ---------- 后端接口 ----------
    # 注意 proxy_pass 结尾不带斜杠：保留原始 /api/... 路径
    location /api/ {
        # 视频上传走这里，必须大于 VIDEO_MAX_MB（默认 100MB）；
        # 普通 JSON 请求仍受后端 express.json 的 1MB 限制约束
        client_max_body_size 110m;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # ---------- 文章页：后端直出 HTML ----------
    # 加 ^~ 是为了让这条规则优先于上面的「静态资源后缀」正则，
    # 否则 /posts/xxx.html 这类旧链接会被当成静态文件去找磁盘
    location ^~ /posts/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # ---------- 本地上传的视频 ----------
    # 视频要支持拖动进度条，靠的是后端 express.static 的 Range 响应；
    # 这里必须把 Range 头原样透传，并关掉缓冲避免大文件占满 worker
    location ^~ /uploads/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 300s;
        access_log off;
    }

    # ---------- 自定义单页（后台新建的页面） ----------
    location ^~ /p/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # ---------- 图片：二进制存在 MySQL 里，只能由后端读出 ----------
    # 后端已带 Cache-Control: immutable，这里不覆盖，仅补充代理参数
    location ^~ /media/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering on;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        access_log off;
    }

    # ---------- 后台入口：不给搜索引擎收录 ----------
    location /admin/ {
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri $uri/ =404;
    }

    # ---------- 其余按静态文件处理 ----------
    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
}
